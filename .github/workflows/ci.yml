name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Verify zero @SuppressWarnings
        run: just no-suppress-warnings

      - name: Run Quality Gate (Verify)
        run: just verify

      - name: Build Showcase Site
        run: just site
