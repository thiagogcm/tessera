name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'

      - name: Verify zero @SuppressWarnings
        run: just no-suppress-warnings

      - name: Install Playwright Browsers and System Dependencies
        run: just browsers --with-deps

      - name: Run Unit Tests, Browser E2E and Quality Gates
        run: just verify

      - name: Upload Browser Traces and Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics
          path: |
            tessera-showcase/target/playwright/
            tessera-showcase/target/failsafe-reports/

      - name: Build Showcase and Consumer Guide
        run: |
          just site
          just guide
