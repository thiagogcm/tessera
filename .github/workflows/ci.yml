name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: 'maven'

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Verify zero @SuppressWarnings
        run: just no-suppress-warnings

      - name: Install Playwright Browsers and System Dependencies
        run: just browsers --with-deps

      - name: Run Unit Tests, Browser E2E and Quality Gates
        run: just verify

      - name: Upload Browser Traces and Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            tessera-showcase/target/playwright/
            tessera-showcase/target/failsafe-reports/

      - name: Build Showcase and Consumer Guide
        run: |
          just site
          just guide
