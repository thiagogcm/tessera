name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: Release version (for example 1.0.0 or 1.0.0-rc.1)
        required: true
        type: string
      nextVersion:
        description: Next development version (blank bumps the minor)
        type: string
      dryRun:
        description: Build and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Stage and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: ${{ !inputs.dryRun }}

      - name: Validate release inputs
        id: versions
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          NEXT_VERSION: ${{ inputs.nextVersion }}
        shell: bash
        run: |
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ ! "$RELEASE_VERSION" =~ ^$stable(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ||
                "${RELEASE_VERSION^^}" == *-SNAPSHOT ]]; then
            echo "::error::Expected a release version such as 1.0.0 or 1.0.0-rc.1."
            exit 1
          fi

          if [[ -z "$NEXT_VERSION" ]]; then
            IFS=. read -r major minor _ <<< "${RELEASE_VERSION%%-*}"
            NEXT_VERSION="$major.$((minor + 1)).0-SNAPSHOT"
          fi
          if [[ ! "$NEXT_VERSION" =~ ^$stable-SNAPSHOT$ ]]; then
            echo "::error::Expected a development version such as 1.1.0-SNAPSHOT."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi
          printf 'release=%s\nnext=%s\n' "$RELEASE_VERSION" "$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release secrets
        env:
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}
        shell: bash
        run: |
          for name in JRELEASER_GPG_PUBLIC_KEY JRELEASER_GPG_SECRET_KEY JRELEASER_GPG_PASSPHRASE \
              JRELEASER_MAVENCENTRAL_USERNAME JRELEASER_MAVENCENTRAL_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name."
              exit 1
            fi
          done

      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: oracle
          cache: maven

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.59.0'

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        run: just set-version "$RELEASE_VERSION"

      - name: Install Playwright browsers and system dependencies
        run: just browsers --with-deps

      - name: Verify and stage libraries
        run: |
          just no-suppress-warnings
          just stage

      - name: Commit release version
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pom.xml '*/pom.xml'
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_VERSION"
          fi
          git push origin HEAD:main

      - name: Validate or publish to Maven Central
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: '1.27.0'
          setup-java: 'false'
          arguments: ${{ inputs.dryRun && 'full-release --dry-run' || 'deploy' }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.versions.outputs.release }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}

      - name: Tag the release commit
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        shell: bash
        run: |
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION" HEAD
          git push origin "refs/tags/v$RELEASE_VERSION"

      - name: Create the GitHub release
        if: ${{ !inputs.dryRun }}
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: '1.27.0'
          setup-java: 'false'
          arguments: release --exclude-deployer-name=sonatype --output-directory=out/github-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.versions.outputs.release }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_MAVENCENTRAL_SONATYPE_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_SONATYPE_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_PASSWORD }}

      - name: Commit next development version
        if: ${{ !inputs.dryRun }}
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next }}
        shell: bash
        run: |
          just set-version "$NEXT_VERSION"
          git add -- pom.xml '*/pom.xml'
          git commit -m "chore(release): prepare for $NEXT_VERSION"
          git push origin HEAD:main

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            out/jreleaser/release/CHANGELOG.md
            out/github-release/jreleaser/trace.log
            out/github-release/jreleaser/output.properties
            out/github-release/jreleaser/release/CHANGELOG.md
            tessera-showcase/target/playwright/
            tessera-showcase/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
